name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]
        env:
            DEBUG: "True"
            SECRET_KEY: ci-only-not-secret
            ALLOWED_HOSTS: "127.0.0.1,localhost"
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
                  cache-dependency-path: backend/requirements.txt
            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r backend/requirements.txt
                  make install-engine PYTHON=python
            - name: Check
              run: make check PYTHON=python

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        env:
            CI: "true"  # warnings fail the build
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Test
              run: npm test -- --watchAll=false
            - name: Build
              run: npm run build

    dco:
        # Every commit in a pull request certifies the DCO (docs/CONTRIBUTING.md).
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Check every commit is signed off
              run: |
                  missing=0
                  for c in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
                      if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
                          echo "::error::$(git show -s --format='%h %s' "$c") is not signed off: see docs/CONTRIBUTING.md"
                          missing=1
                      fi
                  done
                  exit $missing
