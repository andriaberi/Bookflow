# Bookflow is a site, not a package to install: this describes it, and backend/requirements.txt
# lists what it needs.
[project]
name = "bookflow"
version = "1.0.0"
description = "Turns PDF books into EPUBs that read like real books, and keeps a library of them"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andria Beridze" }]
requires-python = ">=3.12"
