[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bookflow"
dynamic = ["version"]
description = "A fast, clean Python tool for converting PDF books into well-structured, reflowable EPUBs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andria Beridze" }]
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24"]
keywords = ["pdf", "epub", "ebook", "converter", "reflowable"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/andriaberi/Bookflow"
Repository = "https://github.com/andriaberi/Bookflow"
Issues = "https://github.com/andriaberi/Bookflow/issues"

[project.scripts]
bookflow = "bookflow.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "build>=1.2",
]

# Build

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bookflow.epub" = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.setuptools.dynamic]
version = { attr = "bookflow.__version__" }

# Ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "PTH",     # use pathlib
    "RUF",     # ruff-specific
]

# Books are multilingual: en dashes, Cyrillic and Greek letters in strings are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# Mypy

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
# PyMuPDF ships type hints for only part of its API.
untyped_calls_exclude = ["pymupdf"]
pretty = true

# Pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

# Coverage

[tool.coverage.run]
source = ["bookflow"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
