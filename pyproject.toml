[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rebind"
dynamic = ["version"]
description = "A fast, clean Python tool for converting PDF books into well-structured, reflowable EPUBs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andria Beridze" }]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pywebview>=5.3",  # the window: a web page in the platform's own web view
]
keywords = ["pdf", "epub", "ebook", "converter", "reflowable", "georgian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Georgian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# Linux without GTK's Python bindings: Qt's web view instead (large, but installs anywhere).
qt = ["pywebview[qt]>=5.3"]

[project.urls]
Homepage = "https://github.com/andriaberi/Rebind"
Repository = "https://github.com/andriaberi/Rebind"
Issues = "https://github.com/andriaberi/Rebind/issues"

[project.scripts]
rebind = "rebind.__main__:main"

# A GUI script opens no console window on Windows.
[project.gui-scripts]
rebind-gui = "rebind.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "build>=1.2",
]

# Build

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rebind.epub" = ["fonts/*.ttf", "fonts/OFL.txt"]
"rebind.gui" = ["web/*"]

[tool.setuptools.dynamic]
version = { attr = "rebind.__version__" }

# Ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "PTH",     # use pathlib
    "RUF",     # ruff-specific
]

# Books are multilingual: en dashes, Cyrillic and Greek letters in strings are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# Mypy

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
# PyMuPDF ships type hints for only part of its API.
untyped_calls_exclude = ["pymupdf"]
pretty = true

# Pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
