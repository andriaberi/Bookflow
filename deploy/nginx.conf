# Bookflow behind nginx: /etc/nginx/sites-available/bookflow, linked from sites-enabled.
# Replace bookflow.example with the domain; certbot --nginx adds the HTTPS parts.

# How often one address may ask, so nobody can keep the server busy: the editor loads a
# page image at a time, so pages get more room; uploads and admin logins much less.
# Django also limits how many forms one visitor posts an hour (bookflow/public.py).
limit_req_zone $binary_remote_addr zone=bookflow:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bookflow_pages:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bookflow_upload:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=bookflow_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=bookflow_conn:10m;

server {
    listen 80;
    server_name bookflow.example;

    # Don't say which nginx this is
    server_tokens off;

    # PDFs up to MAX_PDF_SIZE_MB (100), with room for the form around them
    client_max_body_size 110m;
    # A visitor who sends a request slowly, to hold a connection open, is cut off.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;

    limit_conn bookflow_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    # Errors nginx gives itself, in the API's own form, so the page can say what happened
    error_page 429 = @too_many;
    error_page 413 = @too_big;
    location @too_many {
        default_type application/json;
        return 429 '{"error": "too_many", "detail": "Too many requests; try again later"}';
    }
    location @too_big {
        default_type application/json;
        return 413 '{"error": "too_big", "detail": "The file is too big"}';
    }

    # Uploads: covers and library EPUBs. Opened on their own, nothing in them may run.
    location /media/ {
        root /srv/bookflow/backend;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;

        # Of a conversion, only its cover is shown: the visitor's PDF and its preview
        # EPUB stay on the server, which serves them only through the API.
        location ~ ^/media/conversions/[^/]+/(?!cover\.jpg$) {
            return 404;
        }
        # Suggested books' PDFs, for the admin: downloaded, never opened in the browser
        location ~ \.pdf$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition attachment always;
        }
    }

    # Every request to Django carries the visitor's address, which it limits posts by.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Reading a long PDF is done in the background; uploading one can take a while.
    proxy_read_timeout 120s;

    # Uploading a PDF: to convert, or with a suggested book on the contact page
    location = /api/convert/ {
        limit_req zone=bookflow_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/contact/ {
        limit_req zone=bookflow_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/convert/[^/]+/pages/ {
        limit_req zone=bookflow_pages burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /admin/login/ {
        limit_req zone=bookflow_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        limit_req zone=bookflow burst=40 nodelay;
        # Anything else is small: the editor's book, a cover image, a form.
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8000;
    }
}
