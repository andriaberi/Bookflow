# Bookflow behind nginx: /etc/nginx/sites-available/bookflow, linked from sites-enabled.
# Replace bookflow.example with the domain; certbot --nginx adds the HTTPS parts.
server {
    listen 80;
    server_name bookflow.example;

    # PDFs up to MAX_PDF_SIZE_MB (100), with room for the form around them
    client_max_body_size 110m;

    # Uploads: PDFs, covers and library EPUBs
    location /media/ {
        alias /srv/bookflow/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Django limits how often one visitor posts by this address (bookflow/public.py)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reading a long PDF is done in the background; uploading one can take a while.
        proxy_read_timeout 120s;
    }
}
